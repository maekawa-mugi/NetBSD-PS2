# Shared settings for build-ps2*.sh (sourced; $src is the source top).
# Every path can be overridden from the environment.
BUILDTOP=${BUILDTOP:-$src/build/ps2}
OBJDIR=${OBJDIR:-$BUILDTOP/obj}
TOOLDIR=${TOOLDIR:-$BUILDTOP/tools}
DESTDIR=${DESTDIR:-$BUILDTOP/destdir}
RELEASEDIR=${RELEASEDIR:-$BUILDTOP/release}
JOBS=${JOBS:-$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)}
# NetBSD xsrc checkout (needed only with X=yes), as for build.sh -X.
XSRC=${XSRC:-}
# Ignore the host's /etc/mk.conf (often written for another target);
# set MAKECONF to use a specific one.
MAKECONF=${MAKECONF:-/dev/null}
export MAKECONF
