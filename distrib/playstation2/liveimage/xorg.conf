# Xorg on the GS framebuffer (wsfb, /dev/ttyE0) with USB keyboard/mouse.
Section "ServerFlags"
	Option "AutoAddDevices" "off"
	Option "AutoEnableDevices" "off"
	Option "DontZap" "on"
EndSection
Section "Files"
	ModulePath "/usr/X11R7/lib/modules"
	FontPath "/usr/X11R7/lib/X11/fonts/misc/"
EndSection
Section "InputDevice"
	Identifier "Keyboard0"
	Driver "kbd"
EndSection
Section "InputDevice"
	Identifier "Mouse0"
	Driver "ws"
	Option "Device" "/dev/wsmouse"
EndSection
Section "Device"
	Identifier "GS0"
	Driver "wsfb"
	Option "device" "/dev/ttyE0"
	Option "ShadowFB" "off"
EndSection
Section "Screen"
	Identifier "Screen0"
	Device "GS0"
EndSection
Section "ServerLayout"
	Identifier "Layout0"
	Screen "Screen0"
	InputDevice "Keyboard0" "CoreKeyboard"
	InputDevice "Mouse0" "CorePointer"
EndSection
